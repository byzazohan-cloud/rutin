<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RUTİN">
<title>RUTİN</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=6.27.3">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">

<script>
(function(){
  const FLAG='rutin-v627-refresh-done';
  async function hardRefreshRutin(){
    try{
      if(sessionStorage.getItem(FLAG)==='1') return;
      sessionStorage.setItem(FLAG,'1');

      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>{
          try{
            const u=new URL(reg.scope);
            return u.pathname.includes('/rutin/') ? reg.unregister() : Promise.resolve(false);
          }catch(e){ return Promise.resolve(false); }
        }));
      }

      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('rutin-')).map(k=>caches.delete(k)));
      }

      const u=new URL(location.href);
      if(u.searchParams.get('fresh')!=='v627'){
        u.searchParams.set('fresh','v627');
        location.replace(u.toString());
      }
    }catch(e){}
  }
  hardRefreshRutin();
})();
</script>

</head>
<body>
<div id="app"></div>
<script src="app-v6-27.js?v=6.27.3"></script>
</body>
</html>
